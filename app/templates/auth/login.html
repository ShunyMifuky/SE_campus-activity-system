{% extends "base.html" %}
{% block title %}登录 · 校园活动管理系统{% endblock %}

{% block content %}
<div class="auth-wrap">
  <div class="panel auth-card">
    <h2>登录</h2>
    <p class="hint">使用已注册的账号登录后，可发布活动或报名活动。</p>

    <form method="post" action="{{ url_for('auth.login') }}{% if next %}?next={{ next }}{% endif %}">
      <input type="hidden" name="next" value="{{ next }}">

      <label class="field">
        <span class="field-label">账号</span>
        <input type="text" name="username" value="" required autofocus>
      </label>

      <label class="field">
        <span class="field-label">密码</span>
        <input type="password" name="password" required>
      </label>

      <label class="checkbox">
        <input type="checkbox" name="remember" value="1">
        <span>保持登录状态</span>
      </label>

      <button type="submit" class="btn btn-primary btn-block">登录</button>
    </form>

    <p class="auth-switch">还没有账号？<a href="{{ url_for('auth.register') }}">立即注册</a></p>
  </div>
</div>
{% endblock %}
